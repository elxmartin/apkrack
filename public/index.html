<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Security Scanner Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --badge-bg: #0284c7;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-primary); color: var(--text-main); margin: 2rem; }
        .card { background: var(--bg-card); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .status-badge { background: var(--badge-bg); color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
        .controls { display: flex; gap: 0.5rem; align-items: center; }
        input[type="text"] { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.9rem; }
        input[type="text"]:focus { outline: 1px solid var(--accent); }
        button.btn { background: #2563eb; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        button.btn:hover { background: #1d4ed8; }
        button.btn-secondary { background: #334155; }
        button.btn-secondary:hover { background: #475569; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid var(--border); padding: 12px; text-align: left; }
        th { background: var(--bg-card); color: var(--text-muted); font-weight: 600; }
        button.link-btn { background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 0.95rem; padding: 0; }
        button.link-btn:hover { color: var(--accent-hover); }
        
        /* Modal Viewer Styles */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--bg-card); margin: 4% auto; padding: 1.5rem; border: 1px solid var(--border); width: 85%; max-height: 85vh; border-radius: 8px; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
        .close-btn { color: var(--text-muted); font-size: 28px; font-weight: bold; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: #fff; }
        pre { background: var(--bg-primary); padding: 1rem; border-radius: 6px; overflow: auto; color: var(--accent); white-space: pre-wrap; word-break: break-all; margin-top: 1rem; flex: 1; max-height: 65vh; font-family: monospace; font-size: 0.88rem; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>APK Security Scanner Dashboard</h1>
        <div class="controls">
            <span id="key-indicator" style="font-size: 0.85rem; color: var(--text-muted);">Key: Not set</span>
            <button class="btn btn-secondary" onclick="setEncryptionKey()">Set Key</button>
            <button class="btn btn-secondary" onclick="clearKey()">Clear Key</button>
        </div>
    </div>

    <div class="card">
        <h3>Live Engine Status</h3>
        <p>State: <span id="state" class="status-badge">Idle</span></p>
        <p>Active Target: <code id="current-app" style="color: var(--accent);">None</code></p>
        <p>Progress: <span id="progress">0/0</span></p>
    </div>

    <div class="top-bar">
        <h3>Analyzed Applications</h3>
        <input type="text" id="search" placeholder="Filter packages..." oninput="renderTable()">
    </div>

    <table>
        <thead>
            <tr>
                <th>Package ID</th>
                <th>Timestamp (UTC)</th>
                <th>Encrypted Reports</th>
            </tr>
        </thead>
        <tbody id="completed-apps"></tbody>
    </table>

    <!-- Modal Viewer for Decrypted Outputs -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin: 0;">Report Output</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <pre id="modalBody">Loading and decrypting...</pre>
        </div>
    </div>

    <script>
        let cachedHistory = [];

        function updateKeyIndicator() {
            const hasKey = !!sessionStorage.getItem("REPORT_ENCRYPTION_KEY");
            const indicator = document.getElementById("key-indicator");
            indicator.innerText = hasKey ? "Key: Loaded (Session)" : "Key: Not set";
            indicator.style.color = hasKey ? "#4ade80" : "#94a3b8";
        }

        function setEncryptionKey() {
            const key = prompt("Enter Report Decryption Key:");
            if (key) {
                sessionStorage.setItem("REPORT_ENCRYPTION_KEY", key);
                updateKeyIndicator();
            }
        }

        function clearKey() {
            sessionStorage.removeItem("REPORT_ENCRYPTION_KEY");
            updateKeyIndicator();
        }

        function getDecryptionKey() {
            let key = sessionStorage.getItem("REPORT_ENCRYPTION_KEY");
            if (!key) {
                key = prompt("Enter Report Decryption Key:");
                if (key) {
                    sessionStorage.setItem("REPORT_ENCRYPTION_KEY", key);
                    updateKeyIndicator();
                }
            }
            return key;
        }

        async function decryptOpenSslAes256(encryptedBase64, passphrase, iterations = 100000) {
            const rawBinary = Uint8Array.from(atob(encryptedBase64.trim()), c => c.charCodeAt(0));
            
            // Validate OpenSSL magic "Salted__" (8 bytes)
            const magic = new TextDecoder().decode(rawBinary.subarray(0, 8));
            if (magic !== "Salted__") {
                throw new Error("Invalid payload: Missing OpenSSL 'Salted__' magic header.");
            }

            const salt = rawBinary.subarray(8, 16);
            const ciphertext = rawBinary.subarray(16);

            const enc = new TextEncoder();
            const passKey = await crypto.subtle.importKey(
                "raw",
                enc.encode(passphrase),
                { name: "PBKDF2" },
                false,
                ["deriveBits"]
            );

            // Derive 256-bit key + 128-bit IV = 48 bytes (384 bits)
            const derivedBits = await crypto.subtle.deriveBits(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: iterations,
                    hash: "SHA-256"
                },
                passKey,
                384
            );

            const keyBytes = derivedBits.slice(0, 32);
            const ivBytes = derivedBits.slice(32, 48);

            const aesKey = await crypto.subtle.importKey(
                "raw",
                keyBytes,
                { name: "AES-CBC" },
                false,
                ["decrypt"]
            );

            const decryptedBuffer = await crypto.subtle.decrypt(
                { name: "AES-CBC", iv: ivBytes },
                aesKey,
                ciphertext
            );

            return new TextDecoder().decode(decryptedBuffer);
        }

        async function fetchStatus() {
            try {
                const response = await fetch('./status.json?t=' + Date.now(), {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                });
                const data = await response.json();

                document.getElementById('state').textContent = data.status || 'Idle';
                document.getElementById('current-app').textContent = data.current_app || 'None';
                document.getElementById('progress').textContent = `${data.completed || 0}/${data.total || 0}`;

                cachedHistory = Array.isArray(data.history) ? data.history : [];
                renderTable();
            } catch (e) {
                console.error("Error updating dashboard:", e);
            }
        }

        function renderTable() {
            const list = document.getElementById('completed-apps');
            list.innerHTML = '';
            const query = (document.getElementById('search').value || '').toLowerCase().trim();

            const filtered = cachedHistory.filter(item => 
                !query || (item.package && item.package.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                const row = document.createElement('tr');
                const col = document.createElement('td');
                col.colSpan = 3;
                col.style.textAlign = 'center';
                col.style.color = 'var(--text-muted)';
                col.textContent = query ? 'No matching packages found.' : 'No analyses recorded yet.';
                row.appendChild(col);
                list.appendChild(row);
                return;
            }

            filtered.forEach(item => {
                const row = document.createElement('tr');

                const pkgCell = document.createElement('td');
                pkgCell.textContent = item.package;
                row.appendChild(pkgCell);

                const timeCell = document.createElement('td');
                timeCell.textContent = item.timestamp;
                row.appendChild(timeCell);

                const actionCell = document.createElement('td');

                const secBtn = document.createElement('button');
                secBtn.className = 'link-btn';
                secBtn.textContent = 'Secrets';
                secBtn.onclick = () => viewReport(item.package, 'secrets.txt.enc');
                actionCell.appendChild(secBtn);

                actionCell.appendChild(document.createTextNode(' | '));

                const mobsfBtn = document.createElement('button');
                mobsfBtn.className = 'link-btn';
                mobsfBtn.textContent = 'MobSF Analysis';
                mobsfBtn.onclick = () => viewReport(item.package, 'mobsfscan.json.enc');
                actionCell.appendChild(mobsfBtn);

                row.appendChild(actionCell);
                list.appendChild(row);
            });
        }

        async function viewReport(packageName, fileName) {
            const key = getDecryptionKey();
            if (!key) {
                alert("Decryption key is required to view reports.");
                return;
            }

            const modal = document.getElementById('reportModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = `${packageName} - ${fileName}`;
            modalBody.textContent = "Fetching and decrypting report...";
            modal.style.display = "block";

            try {
                const response = await fetch(`./reports/${packageName}/${fileName}?t=` + Date.now());
                if (!response.ok) throw new Error(`Report not found (${response.status} ${response.statusText}).`);
                
                const encryptedBase64 = await response.text();
                const decryptedString = await decryptOpenSslAes256(encryptedBase64, key);

                try {
                    const parsedJson = JSON.parse(decryptedString);
                    modalBody.textContent = JSON.stringify(parsedJson, null, 2);
                } catch (e) {
                    modalBody.textContent = decryptedString || "(No content found)";
                }
            } catch (err) {
                modalBody.textContent = "Decryption Failed: " + err.message + "\n\nPlease check that your decryption key is correct.";
            }
        }

        function closeModal() {
            document.getElementById('reportModal').style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('reportModal');
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };

        updateKeyIndicator();
        setInterval(fetchStatus, 5000);
        fetchStatus();
    </script>
</body>
</html>
