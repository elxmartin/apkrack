<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Security Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; border: 1px solid #334155; }
        .status-badge { background: #0284c7; color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
        th { background: #1e293b; }
        button.link-btn { background: none; border: none; color: #38bdf8; text-decoration: underline; cursor: pointer; font-size: 1rem; padding: 0; }
        button.link-btn:hover { color: #7dd3fc; }
        
        /* Modal Viewer Styles */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #1e293b; margin: 5% auto; padding: 1.5rem; border: 1px solid #334155; width: 80%; max-height: 80vh; border-radius: 8px; overflow-y: auto; }
        .close-btn { color: #94a3b8; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        pre { background: #0f172a; padding: 1rem; border-radius: 6px; overflow-x: auto; color: #38bdf8; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Automated Target App Scanner</h1>

    <div class="card">
        <h3>Live Engine Status</h3>
        <p>State: <span id="state" class="status-badge">Idle</span></p>
        <p>Active Target: <code id="current-app">None</code></p>
        <p>Progress: <span id="progress">0/0</span></p>
    </div>

    <h3>Analyzed Applications</h3>
    <table>
        <thead>
            <tr>
                <th>Package ID</th>
                <th>Timestamp (UTC)</th>
                <th>Encrypted Reports</th>
            </tr>
        </thead>
        <tbody id="completed-apps"></tbody>
    </table>

    <!-- Modal Viewer for Decrypted Outputs -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Report Output</h3>
            <pre id="modalBody">Loading and decrypting...</pre>
        </div>
    </div>

    <script>
        // Get or prompt for passphrase with session caching
        function getDecryptionKey() {
            let key = sessionStorage.getItem("REPORT_ENCRYPTION_KEY");
            if (!key) {
                key = prompt("Enter Report Decryption Key:");
                if (key) {
                    sessionStorage.setItem("REPORT_ENCRYPTION_KEY", key);
                }
            }
            return key;
        }

        async function fetchStatus() {
            try {
                const response = await fetch('./status.json?t=' + Date.now(), {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                });
                const data = await response.json();

                document.getElementById('state').innerText = data.status;
                document.getElementById('current-app').innerText = data.current_app || 'None';
                document.getElementById('progress').innerText = `${data.completed}/${data.total}`;

                const list = document.getElementById('completed-apps');
                list.innerHTML = '';
                data.history.slice().reverse().forEach(item => {
                    list.innerHTML += `
                        <tr>
                            <td>${item.package}</td>
                            <td>${item.timestamp}</td>
                            <td>
                                <button class="link-btn" onclick="viewReport('${item.package}', 'secrets.txt.enc')">Secrets</button> | 
                                <button class="link-btn" onclick="viewReport('${item.package}', 'mobsfscan.json.enc')">MobSF Analysis</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error("Error updating dashboard:", e);
            }
        }

        async function viewReport(packageName, fileName) {
            const key = getDecryptionKey();
            if (!key) {
                alert("Decryption key is required to view reports.");
                return;
            }

            const modal = document.getElementById('reportModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.innerText = `${packageName} - ${fileName}`;
            modalBody.innerText = "Decrypting payload...";
            modal.style.display = "block";

            try {
                const response = await fetch(`./reports/${packageName}/${fileName}?t=` + Date.now());
                if (!response.ok) throw new Error("Report file not found.");
                
                const encryptedBase64 = await response.text();

                // Decrypt using OpenSSL-compatible AES mode
                const decryptedBytes = CryptoJS.AES.decrypt(encryptedBase64.trim(), key);
                const decryptedString = decryptedBytes.toString(CryptoJS.enc.Utf8);

                if (!decryptedString) {
                    throw new Error("Invalid decryption key or corrupted payload.");
                }

                // Format as JSON if applicable, otherwise display as plain text
                try {
                    const parsedJson = JSON.parse(decryptedString);
                    modalBody.innerText = JSON.stringify(parsedJson, null, 2);
                } catch (e) {
                    modalBody.innerText = decryptedString;
                }
            } catch (err) {
                modalBody.innerText = "Decryption Error: " + err.message;
            }
        }

        function closeModal() {
            document.getElementById('reportModal').style.display = "none";
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('reportModal');
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };

        setInterval(fetchStatus, 5000);
        fetchStatus();
    </script>
</body>
</html>
