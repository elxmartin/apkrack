name: Continuous Security Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java Runtime (for JADX)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache JADX Installation
      - name: Cache JADX
        id: cache-jadx
        uses: actions/cache@v4
        with:
          path: /usr/local/jadx
          key: jadx-1.5.6-v1

      # Cache Cargo Binaries (apkeep)
      - name: Cache Cargo Binaries
        id: cache-cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/apkeep
          key: cargo-apkeep-v1

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl unzip
          pip install mobsfscan

          # Install JADX if not retrieved from cache
          if [ "${{ steps.cache-jadx.outputs.cache-hit }}" != 'true' ]; then
            JADX_VER="1.5.6"
            curl -L -o jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VER}/jadx-${JADX_VER}.zip"
            sudo mkdir -p /usr/local/jadx
            sudo unzip -q jadx.zip -d /usr/local/jadx
            rm jadx.zip
          fi
          sudo ln -sf /usr/local/jadx/bin/jadx /usr/local/bin/jadx

          # Install apkeep via cargo if not retrieved from cache
          if [ "${{ steps.cache-cargo.outputs.cache-hit }}" != 'true' ]; then
            cargo install apkeep
          fi

      - name: Execute Pipeline Engine
        run: |
          chmod +x .github/scripts/run_pipeline.sh
          ./.github/scripts/run_pipeline.sh

      - name: Deploy Final Static Site to GitHub Pages
        uses: actions/deploy-pages@v4