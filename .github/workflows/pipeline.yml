name: Continuous Security Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java Runtime (for JADX)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache JADX
        uses: actions/cache@v4
        with:
          path: ~/.local/jadx
          key: jadx-1.5.6-v1

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl unzip ripgrep
          pip install --no-cache-dir mobsfscan pyyaml

          if [ ! -d "$HOME/.local/jadx" ]; then
            mkdir -p $HOME/.local/jadx
            wget -q https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
            unzip -q jadx-1.5.6.zip -d $HOME/.local/jadx
            rm jadx-1.5.6.zip
          fi
          echo "$HOME/.local/jadx/bin" >> $GITHUB_PATH

          if [ ! -f /usr/local/bin/apkeep ]; then
            curl -sSL -o /tmp/apkeep "https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu"
            chmod +x /tmp/apkeep
            sudo mv /tmp/apkeep /usr/local/bin/apkeep
          fi

      - name: Execute Pipeline Engine
        env:
          REPORT_ENCRYPTION_KEY: ${{ secrets.REPORT_ENCRYPTION_KEY }}
        run: |
          trivy image --download-db-only
          chmod +x .github/scripts/run_pipeline.sh
          chmod +x .github/scripts/fetch_targets.sh
          ./.github/scripts/run_pipeline.sh

      - name: Bundle Static Assets for Pages
        run: |
          if [ -f "theme.json" ]; then
            cp theme.json public/theme.json
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy Final Static Site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4